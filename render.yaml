services:
  # Single service: Express serves the API and the built React app from one URL.
  - type: web
    name: emcy-dashboard
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: emcy-data
      diskGB: 1
      mountPath: /data
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false   # set in the Render dashboard before first deploy
      - key: JWT_EXPIRE
        value: 7d
      - key: EMCY_DATA_DIR
        value: /data
      - key: EMCY_UPLOADS_DIR
        value: /data/uploads
